[project]
name = "invoicelens-api"
version = "0.1.0"
description = "InvoiceLens document review API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0.38,<3",
  "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "argon2-cffi>=23.1,<26",
  "pypdfium2>=5,<6",
  "pillow>=11,<13",
  "reportlab>=4.3,<5",
  "openpyxl>=3.1.5,<4",
  "langchain>=1,<2",
  "langchain-core>=1,<2",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "langgraph-checkpoint-postgres>=3,<4",
  "langchain-openai>=1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "ty>=0.0.84",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoicelens"]

[tool.pytest.ini_options]
testpaths = ["../../tests/backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"] # FastAPI declarations call Depends/File; formatter handles wrapping.
